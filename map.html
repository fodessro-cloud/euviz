<!DOCTYPE html>

<body>

<header class="fh">
  <div class="fh-row">
    <a class="fh-logo" href="/" aria-label="FINILA home"><svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="6" width="12" height="52" rx="2" fill="#0F1B33"/><rect x="24" y="6" width="32" height="12" rx="2" fill="#F2B33D"/><rect x="24" y="24" width="22" height="12" rx="2" fill="#5B9BFF"/><rect x="24" y="42" width="12" height="12" rx="2" fill="#2C3A5A"/></svg>FINILA</a>

      <a href="/archiv/">Archive</a>
    </nav>
  </div>
</header>
<script>(function(){var n=document.querySelector('.fh-nav'),a=n&&n.querySelector('[aria-current]');if(a)n.scrollLeft=a.offsetLeft-n.offsetLeft-16;})();</script>
<div class="real-banner" id="hm-banner">Real data: share prices from Deutsche Börse (15 minutes delayed), company figures from annual reports. Market value is estimated from the annual report or the shares in issue. Not investment advice.</div>

<div class="hm-controls">
  <div class="hm-control-group">
    <label for="hm-country">Market</label>
    <select class="hm-select" id="hm-country"><option value="">All Europe</option></select>
  </div>
  <div class="hm-control-group">
    <label>Group by</label>
    <button class="hm-btn active" type="button" data-hm-group="sector">Sector</button>
    <button class="hm-btn" type="button" data-hm-group="country">Country</button>
  </div>
  <div class="hm-control-group">
    <label>Color by</label>
    <span class="hm-btns" id="hm-colors"></span>
  </div>
  <div class="hm-legend" id="hm-legend"></div>
</div>
<div class="hm-note" id="hm-note">Loading companies…</div>

<div class="hm-canvas-wrap" id="hm-wrap">
  <canvas id="heatmap-canvas" aria-label="Market map of European companies: box size is market value, color is the chosen figure"></canvas>
  <div id="hm-hover"></div>
</div>

<div id="hm-tooltip"></div>

<script src="js/url-state.js"></script>
<script src="js/heatmap.js"></script>
<script src="js/analytics.js" defer></script>
