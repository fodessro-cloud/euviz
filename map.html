<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINILA — Market Maps</title>
  <link rel="icon" href="css/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <a class="logo" href="index.html" aria-label="FINILA home"><svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="6" width="12" height="52" rx="2" fill="#E8EDF7"/><rect x="24" y="6" width="32" height="12" rx="2" fill="#F2B33D"/><rect x="24" y="24" width="22" height="12" rx="2" fill="#5B9BFF"/><rect x="24" y="42" width="12" height="12" rx="2" fill="#2C3A5A"/></svg>FINILA</a>
  <nav class="nav-links">
    <a class="nav-link" href="screener.html"  data-page="screener">Stocks</a>
    <a class="nav-link"        href="companies.html">Fundamentals</a>
    <a class="nav-link"        href="insiders.html">Insider trades</a>
    <a class="nav-link active" href="map.html"   data-page="map">Market map</a>
    <a class="nav-link" href="groups.html" data-page="groups">Sectors &amp; countries</a>
    <a class="nav-link" href="index.html#porovnanie">Compare investments</a>
    <a class="nav-link" href="/archiv/">Archive</a>
  </nav>
  <div class="header-right">
    <div class="market-status">
      <div class="status-dot"></div>
      <span>Demo</span>
    </div>
    <span style="color:var(--text2);font-size:11px;" id="clock"></span>
  </div>
</header>
<div class="demo-banner" style="background:#3a2a00;color:#ffd27a;font-size:12px;text-align:center;padding:5px 12px;border-bottom:1px solid #5a4300;flex-shrink:0;">FINILA preview: figures on this page are illustrative, not real market data. Not investment advice.</div>

<div class="indices-bar" id="indices-bar"></div>

<!-- HEATMAP CONTROLS -->
<div class="hm-controls">
  <div class="hm-control-group">
    <label>Group By</label>
    <button class="hm-btn active" data-hm-group="sector">Sector</button>
    <button class="hm-btn" data-hm-group="country">Country</button>
    <button class="hm-btn" data-hm-group="exchange">Exchange</button>
  </div>
  <div class="hm-control-group">
    <label>Box Size</label>
    <span style="font-size:11px;color:var(--text2)">Market Cap</span>
  </div>
  <div class="hm-control-group">
    <label>Color By</label>
    <button class="hm-btn active" data-hm-color="change">Day Chg %</button>
    <button class="hm-btn" data-hm-color="revenueGrowth">Rev Growth</button>
    <button class="hm-btn" data-hm-color="epsGrowth">EPS Growth</button>
    <button class="hm-btn" data-hm-color="netMargin">Net Margin</button>
  </div>
  <div class="hm-legend">
    <span>-5%</span>
    <div class="hm-legend-bar"></div>
    <span>+5%</span>
  </div>
</div>

<!-- CANVAS -->
<div class="hm-canvas-wrap" style="height:calc(100vh - 42px - 36px - 30px - 48px);">
  <canvas id="heatmap-canvas"></canvas>
</div>

<!-- TOOLTIP -->
<div id="hm-tooltip"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/heatmap.js"></script>
<script>
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit',second:'2-digit'}) + ' CET';
  }
  updateClock(); setInterval(updateClock, 1000);
</script>
<script src="js/analytics.js" defer></script>
</body>
</html>
