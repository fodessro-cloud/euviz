<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINILA — Market Maps</title>
  <link rel="icon" href="css/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/header.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="fh">
  <div class="fh-row">
    <a class="fh-logo" href="/" aria-label="FINILA home"><svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="6" width="12" height="52" rx="2" fill="#0F1B33"/><rect x="24" y="6" width="32" height="12" rx="2" fill="#F2B33D"/><rect x="24" y="24" width="22" height="12" rx="2" fill="#5B9BFF"/><rect x="24" y="42" width="12" height="12" rx="2" fill="#2C3A5A"/></svg>FINILA</a>
    <nav class="fh-nav" aria-label="Main menu">
      <a href="/screener">Stocks</a>
      <a href="/companies">Fundamentals</a>
      <a href="/insiders">Insider trades</a>
      <a href="/shorts">Short positions</a>
      <a href="/map" aria-current="page">Market map</a>
      <a href="/groups">Sectors &amp; countries</a>
      <a href="/invest">Where to put money</a>
      <a href="/archiv/">Archive</a>
    </nav>
  </div>
</header>
<script>(function(){var a=document.querySelector('.fh-nav [aria-current]');if(a)a.parentNode.scrollLeft=a.offsetLeft-a.parentNode.offsetLeft-16;})();</script>
<div class="demo-banner" style="background:#FFF4D6;color:#6B4A00;font-size:12px;text-align:center;padding:5px 12px;border-bottom:1px solid #F0D58A;flex-shrink:0;">FINILA preview: figures on this page are illustrative, not real market data. Not investment advice.</div>

<div class="indices-bar" id="indices-bar"></div>

<!-- HEATMAP CONTROLS -->
<div class="hm-controls">
  <div class="hm-control-group">
    <label>Group By</label>
    <button class="hm-btn active" data-hm-group="sector">Sector</button>
    <button class="hm-btn" data-hm-group="country">Country</button>
    <button class="hm-btn" data-hm-group="exchange">Exchange</button>
  </div>
  <div class="hm-control-group">
    <label>Box Size</label>
    <span style="font-size:11px;color:var(--text2)">Market Cap</span>
  </div>
  <div class="hm-control-group">
    <label>Color By</label>
    <button class="hm-btn active" data-hm-color="change">Day Chg %</button>
    <button class="hm-btn" data-hm-color="revenueGrowth">Rev Growth</button>
    <button class="hm-btn" data-hm-color="epsGrowth">EPS Growth</button>
    <button class="hm-btn" data-hm-color="netMargin">Net Margin</button>
  </div>
  <div class="hm-legend">
    <span>-5%</span>
    <div class="hm-legend-bar"></div>
    <span>+5%</span>
  </div>
</div>

<!-- CANVAS -->
<div class="hm-canvas-wrap" style="height:calc(100vh - 42px - 36px - 30px - 48px);">
  <canvas id="heatmap-canvas"></canvas>
</div>

<!-- TOOLTIP -->
<div id="hm-tooltip"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/heatmap.js"></script>
<script src="js/analytics.js" defer></script>
</body>
</html>
