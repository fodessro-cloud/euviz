name: Ceny bytov za m² (denne)

# Downloads actual home prices (EUR per m²) from national statistics offices once a day.
on:
  schedule:
    - cron: '35 5 * * *'
  push:
    branches: [claude/project-thread-ms2i2k]
    paths: ['scripts/data/housing_levels.py', '.github/workflows/housing-levels.yml', 'data/probe-urls.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: housing-levels
  cancel-in-progress: false

jobs:
  levels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spreadsheet readers
        run: pip install --quiet openpyxl==3.1.5 xlrd==2.0.1
      - name: Download home prices per m²
        run: |
          set -o pipefail
          mkdir -p data
          python scripts/data/housing_levels.py 2>&1 | tee data/housing-levels.log || { echo "::error::$(grep -E 'FAIL|Error' data/housing-levels.log | head -5 | tr '\n' ' ')"; exit 1; }
          grep -E "^(ok|FAIL)" data/housing-levels.log | while read -r l; do echo "::notice::$l"; done || true
      - name: Probe new sources (urls in data/probe-urls.txt, work branch only)
        if: github.ref != 'refs/heads/main' && hashFiles('data/probe-urls.txt') != ''
        run: python scripts/data/housing_levels.py --probe $(cat data/probe-urls.txt) > data/probe.log 2>&1 || true
      - name: Commit results
        if: always()
        run: |
          git config user.name "finila-data-bot"
          git config user.email "finila-data-bot@users.noreply.github.com"
          git add data/housing-levels.log js/housing-levels.json data/probe.log 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Update home prices per m² [data refresh]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
  upload:
    needs: levels
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same lock as deploy-finila.yml, so a data upload never overlaps a site deploy.
    concurrency:
      group: finila-webglobe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload data files to finila.com
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER || 'sftp://ftp.finila.com:222' }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME || 'finila.com' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || '/' }}
        run: |
          scripts/upload-data.sh
          scripts/upload-property-pages.sh
