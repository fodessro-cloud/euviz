name: Ceny akcií (Xetra)

on:
  push:
    branches: [feat/xetra-prices]
    paths: ['scripts/data/prices.py', '.github/workflows/prices.yml']
  schedule:
    - cron: '15 5 * * *'   # every day at 05:15 UTC; Xetra's file for the previous trading day is ready by then
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read Xetra closing prices
        run: |
          set -o pipefail
          mkdir -p data
          python scripts/data/prices.py 2>&1 | tee data/prices.log || { echo "::error::prices: $(tail -3 data/prices.log | tr '\n' ' ')"; exit 1; }
      - name: Commit results
        run: |
          git config user.name "finila-data-bot"
          git config user.email "finila-data-bot@users.noreply.github.com"
          git add data/prices-history.json data/prices.log js/prices.js
          git diff --cached --quiet || git commit -m "Update Xetra prices [data refresh]"
          git pull --rebase -X theirs || true
          git push

  upload:
    needs: prices
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same lock as deploy-finila.yml, so a data upload never overlaps a site deploy.
    concurrency:
      group: finila-webglobe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload data files to finila.com
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER || 'sftp://ftp.finila.com:222' }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME || 'finila.com' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || '/' }}
        run: scripts/upload-data.sh
