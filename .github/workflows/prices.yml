name: Ceny akcií (Xetra)

on:
  push:
    branches: [feat/company-prices]
    paths: ['scripts/data/prices.py', '.github/workflows/prices.yml']
  schedule:
    - cron: '15 5 * * *'      # 05:15 UTC: official closes from the previous trading day's daily file
    - cron: '20 7-17 * * 1-5' # hourly while Xetra trades (09:00-17:30 CET), prices 15 minutes late
    # GitHub often starts scheduled runs late or drops them (2026-10-20: nothing before 10:00 UTC), so a
    # second slot each half hour; a run with no new minute files only re-reads what is there.
    - cron: '50 6-16 * * 1-5'
  workflow_dispatch:
    inputs:
      redo_day:
        description: 'Read the last daily file again (rebuilds the 1H/4H/1D charts)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Today's minute prices so far (data/live-bars.json, too big for git) carry over between runs here.
      - uses: actions/cache@v4
        with:
          path: data/live-bars.json
          key: live-bars-${{ github.run_id }}
          restore-keys: live-bars-
      - name: Read Xetra and Frankfurt prices
        env:
          PRICES_REDO_DAY: ${{ inputs.redo_day && '1' || '0' }}
        run: |
          set -o pipefail
          mkdir -p data
          python scripts/data/prices.py 2>&1 | tee data/prices.log || { echo "::error::prices: $(tail -3 data/prices.log | tr '\n' ' ')"; exit 1; }
      - name: Commit results
        run: |
          git config user.name "finila-data-bot"
          git config user.email "finila-data-bot@users.noreply.github.com"
          git add data/prices-history.json data/prices-week.json data/prices-state.json data/prices.log js/prices.js js/company-prices.json
          git diff --cached --quiet || git commit -m "Update Xetra prices [data refresh]"
          git pull --rebase -X theirs || true
          git push
      # Minute prices of the closed day or the day in progress (js/intraday/, not in git) exist only in this job, so they go up from here.
      - name: Upload intraday charts
        if: github.ref == 'refs/heads/main' && hashFiles('js/intraday/*.json') != ''
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER || 'sftp://ftp.finila.com:222' }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME || 'finila.com' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || '/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "set net:max-retries 3; set net:timeout 30; set sftp:auto-confirm yes; cd '$FTP_DIR' && mkdir -p js/intraday; mirror -R --parallel=8 --no-perms js/intraday js/intraday; bye" "$FTP_SERVER" 2>err.txt || { echo "::error title=Intraday upload failed::$(tail -n 5 err.txt | tr '\n' ' ' | sed "s/$FTP_PASSWORD/***/g")"; exit 1; }
          echo "Uploaded $(ls js/intraday | wc -l) intraday files."

  upload:
    needs: prices
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same lock as deploy-finila.yml, so a data upload never overlaps a site deploy.
    concurrency:
      group: finila-webglobe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload data files to finila.com
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER || 'sftp://ftp.finila.com:222' }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME || 'finila.com' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || '/' }}
        run: scripts/upload-data.sh

  # GitHub often starts scheduled runs hours late or drops them (2026-10-20 and 21: no morning runs at
  # all). So every run on main starts the next one itself (Lub agreed, 2026-10-21): about an hour later
  # while Xetra trades, 05:15 UTC for the morning data (morning.yml), and a relay run at least every
  # 6 hours in between, because a job may wait at most 6 hours. A newer run cancels the waiting one,
  # so there is only ever one chain however the runs start.
  next:
    needs: upload
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      actions: write
    concurrency:
      group: prices-next
      cancel-in-progress: true
    steps:
      - name: Wait, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          now=$(date -u +%s); day=$(date -u +%F); wd=$(date -u +%u)
          at() { date -u -d "$1 $2" +%s; }
          next=$(( now + 300 * 60 )); what=prices.yml               # relay within the 6-hour limit
          for d in "$day" "$(date -u -d tomorrow +%F)"; do
            t=$(at "$d" 05:15); [ "$t" -gt $(( now + 300 )) ] && [ "$t" -lt "$next" ] && { next=$t; what=morning.yml; }
          done
          if [ "$wd" -le 5 ]; then                                   # hourly while Xetra trades
            t=$(( now + 45 * 60 )); open=$(at "$day" 07:20); close=$(at "$day" 17:20)
            [ "$t" -lt "$open" ] && t=$open
            [ "$t" -le "$close" ] && [ "$t" -lt "$next" ] && { next=$t; what=prices.yml; }
          fi
          echo "Next: $what at $(date -u -d @$next '+%F %H:%M') UTC."
          sleep $(( next - now ))
          gh workflow run "$what" --ref main
