name: probe-prices
on:
  push:
    branches: [probe/price-sources]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sources
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          p(){ echo "=================== $1"; curl -sSL -m 30 -A "$UA" -H "Accept: */*" -o out.bin -w "HTTP %{http_code} %{size_download}B %{content_type}\n" "$1"; head -c ${2:-1500} out.bin | tr -d '\000'; echo; }
          p https://mfs.deutsche-boerse.com/DETR-posttrade 4000
          p "https://mfs.deutsche-boerse.com/api/DETR-posttrade" 3000
          p https://www.nasdaqomxnordic.com/shares 800
          p "https://api.nasdaq.com/api/nordic/search?searchText=Novo" 1500
          p "https://api.nasdaq.com/api/nordic/instruments/CSE1158/chart/download?assetClass=SHARES&fromDate=2026-10-01&toDate=2026-10-16" 1500
          p "https://api.londonstockexchange.com/api/gw/lse/instruments/alldata/AZN" 1500
          p "https://www.londonstockexchange.com/stock/AZN/astrazeneca-plc/company-page" 500
          p https://mfs.deutsche-boerse.com/robots.txt 500
          p https://api.nasdaq.com/robots.txt 500
