name: probe-prices
on:
  push:
    branches: [probe/price-sources]
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, 'probe output')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe sources
        run: |
          exec > probe-out.txt 2>&1
          set -x
          F=$(curl -sS https://mfs.deutsche-boerse.com/api/DETR-posttrade | python3 -c "import json,sys;print([f for f in json.load(sys.stdin)['CurrentFiles'] if 'daily' in f][0])")
          echo FILE $F
          curl -sS -o d.json.gz "https://mfs.deutsche-boerse.com/api/download/$F" -w "HTTP %{http_code} %{size_download}\n"
          file d.json.gz; ls -la d.json.gz
          python3 - <<'PY'
          import gzip,json,collections
          raw=gzip.open('d.json.gz').read()
          print('bytes',len(raw)); print(raw[:1500].decode('utf8','replace'))
          try:
            d=json.loads(raw)
          except Exception as e:
            lines=raw.splitlines(); print('lines',len(lines)); d=[json.loads(l) for l in lines[:200000] if l.strip()]
          recs=d if isinstance(d,list) else next(v for v in d.values() if isinstance(v,list))
          print('records',len(recs)); print(json.dumps(recs[:2])[:1500])
          s=json.dumps(recs)
          for i in ['DE0007164600','CH0038863350','NL0010273215','FR0000121014','DK0062498333','GB0009895292','ES0148396007','IT0003128367']:
            print(i, s.count(i))
          PY
      - name: Save output
        if: always()
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe-out.txt; git commit -m "probe output"; git push
