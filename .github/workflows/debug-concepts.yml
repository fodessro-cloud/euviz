name: Debug concepts (temporary)
on:
  push:
    branches: [claude/project-thread-ms2i2k]
    paths: ['scripts/data/debug_concepts.py']
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/data/debug_concepts.py > data/debug-concepts.txt 2>&1 || true
      - run: |
          git config user.name "finila-data-bot"
          git config user.email "finila-data-bot@users.noreply.github.com"
          git add data/debug-concepts.txt && git commit -m "debug concepts [data refresh]" && for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
