name: Shorty fondov (overenie zdrojov)

on:
  push:
    branches: [claude/project-thread-ms2i2k]
    paths: ['scripts/data/probe_shorts.sh', '.github/workflows/shorts-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/data/probe_shorts.sh
      - name: Commit results
        run: |
          git config user.name "finila-data-bot"
          git config user.email "finila-data-bot@users.noreply.github.com"
          git add -f data/probe
          git diff --cached --quiet && exit 0
          git commit -m "Short-position source probe [data refresh]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
