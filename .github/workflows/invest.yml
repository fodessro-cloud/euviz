name: Kam s peniazmi (denne)

# Downloads deposit rates, bond yields, inflation, house prices, stocks and gold from the
# ECB, Eurostat and the Bundesbank once a day. On main it also uploads the data file
# (js/invest.json) to finila.com; pages are published only by deploy-finila.yml.
on:
  schedule:
    - cron: '10 5 * * *'
  push:
    branches: [claude/project-thread-wlsy64]
    paths: ['scripts/data/invest.py', '.github/workflows/invest.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: invest
  cancel-in-progress: false

jobs:
  invest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download ECB, Eurostat and Bundesbank series
        run: |
          set -o pipefail
          mkdir -p data
          python scripts/data/invest.py 2>&1 | tee data/invest.log || { echo "::error::invest: $(grep FAIL data/invest.log | head -5 | tr '\n' ' ')"; exit 1; }
          grep FAIL data/invest.log | while read -r l; do echo "::warning::$l"; done || true
      - name: Commit results
        if: always()
        run: |
          git config user.name "finila-data-bot"
          git config user.email "finila-data-bot@users.noreply.github.com"
          git add data/invest.log js/invest.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Update investment comparison data [data refresh]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done

  upload:
    needs: invest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same lock as deploy-finila.yml, so a data upload never overlaps a site deploy.
    concurrency:
      group: finila-webglobe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload data files to finila.com
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER || 'sftp://ftp.finila.com:222' }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME || 'finila.com' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || '/' }}
        run: scripts/upload-data.sh
