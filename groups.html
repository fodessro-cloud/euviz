<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINILA — Groups</title>
  <link rel="icon" href="css/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/header.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="fh">
  <div class="fh-row">
    <a class="fh-logo" href="/" aria-label="FINILA home"><svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="6" width="12" height="52" rx="2" fill="#0F1B33"/><rect x="24" y="6" width="32" height="12" rx="2" fill="#F2B33D"/><rect x="24" y="24" width="22" height="12" rx="2" fill="#5B9BFF"/><rect x="24" y="42" width="12" height="12" rx="2" fill="#2C3A5A"/></svg>FINILA</a>
    <nav class="fh-nav" aria-label="Main menu">
      <a href="/companies">Screener</a>
      <a href="/map">Maps</a>
      <a href="/groups" aria-current="page">Groups</a>
      <a href="/insiders">Insiders</a>
      <a href="/shorts">Shorts</a>
      <a href="/invest">Assets</a>
      <a href="/property">Property</a>
      <a href="/archiv/">Archive</a>
    </nav>
  </div>
</header>
<script>(function(){var n=document.querySelector('.fh-nav'),a=n&&n.querySelector('[aria-current]');if(a)n.scrollLeft=a.offsetLeft-n.offsetLeft-16;})();</script>
<div class="demo-banner" style="background:#FFF4D6;color:#6B4A00;font-size:12px;text-align:center;padding:5px 12px;border-bottom:1px solid #F0D58A;flex-shrink:0;">FINILA preview: figures on this page are illustrative, not real market data. Not investment advice.</div>

<div class="indices-bar" id="indices-bar"></div>

<!-- GROUPS TOOLBAR -->
<div class="groups-toolbar">
  <label>Group By</label>
  <button class="hm-btn active" data-group-by="sector">Sector</button>
  <button class="hm-btn" data-group-by="country">Country</button>
  <button class="hm-btn" data-group-by="exchange">Exchange</button>
  <button class="hm-btn" data-group-by="industry">Industry</button>
  <span style="margin-left:auto;font-size:11px;color:var(--text2)">Click a row to expand stocks</span>
</div>

<!-- TABLE -->
<div style="overflow:auto;height:calc(100vh - 42px - 36px - 30px - 44px);">
  <table id="groups-table">
    <thead>
      <tr>
        <th onclick="onGroupSortClick('name')">#</th>
        <th onclick="onGroupSortClick('name')">Group</th>
        <th onclick="onGroupSortClick('count')">#Stocks</th>
        <th onclick="onGroupSortClick('marketCap')">Mkt Cap</th>
        <th onclick="onGroupSortClick('avgChange')">Avg Chg%</th>
        <th onclick="onGroupSortClick('avgPE')">Avg P/E</th>
        <th onclick="onGroupSortClick('avgDividend')">Avg Div%</th>
        <th onclick="onGroupSortClick('avgROE')">Avg ROE</th>
        <th onclick="onGroupSortClick('avgRevGrowth')">Rev Growth</th>
        <th onclick="onGroupSortClick('avgMargin')">Net Margin</th>
        <th onclick="onGroupSortClick('avgBeta')">Avg Beta</th>
        <th>Adv/Dec</th>
      </tr>
    </thead>
    <tbody id="groups-tbody"></tbody>
  </table>
</div>

<script src="js/data.js"></script>
<script src="js/prices.js"></script>
<script src="js/live-prices.js"></script>
<script src="js/app.js"></script>
<script src="js/groups.js"></script>
<script src="js/analytics.js" defer></script>
</body>
</html>
