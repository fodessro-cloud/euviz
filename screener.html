<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINILA — European Stock Screener</title>
  <link rel="icon" href="css/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- HEADER -->
<header class="fh">
  <div class="fh-row">
    <a class="fh-logo" href="/" aria-label="FINILA home"><svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="6" width="12" height="52" rx="2" fill="#0F1B33"/><rect x="24" y="6" width="32" height="12" rx="2" fill="#F2B33D"/><rect x="24" y="24" width="22" height="12" rx="2" fill="#5B9BFF"/><rect x="24" y="42" width="12" height="12" rx="2" fill="#2C3A5A"/></svg>FINILA</a>
    <nav class="fh-nav" aria-label="Main menu">
      <a href="/screener" aria-current="page">Stocks</a>
      <a href="/companies">Fundamentals</a>
      <a href="/insiders">Insider trades</a>
      <a href="/shorts">Short positions</a>
      <a href="/map">Market map</a>
      <a href="/groups">Sectors &amp; countries</a>
      <a href="/invest">Where to put money</a>
      <a href="/archiv/">Archive</a>
    </nav>
  </div>
</header>
<script>(function(){var a=document.querySelector('.fh-nav [aria-current]');if(a)a.parentNode.scrollLeft=a.offsetLeft-a.parentNode.offsetLeft-16;})();</script>
<div class="demo-banner" style="background:#FFF4D6;color:#6B4A00;font-size:12px;text-align:center;padding:5px 12px;border-bottom:1px solid #F0D58A;flex-shrink:0;">FINILA preview: figures on this page are illustrative, not real market data. Not investment advice.</div>

<!-- INDICES BAR -->
<div class="indices-bar" id="indices-bar"></div>


<!-- OVERVIEW STATS -->
<div class="overview-bar" id="overview-bar"></div>

<!-- MAIN LAYOUT -->
<div class="page-wrap">
  <div class="page-content">

    <!-- FILTER SIDEBAR -->
    <aside class="filter-sidebar">
      <h3>Filters</h3>
      <div id="filter-panel"></div>
      <div class="filter-actions">
        <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
      </div>
    </aside>

    <!-- SCREENER TABLE AREA -->
    <div class="screener-main">
      <div class="screener-toolbar">
        <span class="result-count" id="result-count">Loading…</span>
        <div style="display:flex;gap:6px;align-items:center;">
          <span style="font-size:11px;color:var(--text2)">Columns:</span>
          <button class="btn btn-secondary" style="font-size:10.5px;" onclick="toggleColumns()">Customize</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="screener-table"></table>
      </div>
      <div id="pagination"></div>
    </div>
  </div>
</div>

<!-- STOCK DETAIL MODAL -->
<div id="stock-modal">
  <div class="modal-box" id="modal-content"></div>
</div>

<script src="js/data.js"></script>
<script src="js/fundamentals.js"></script>
<script src="js/app.js"></script>
<script src="js/screener.js"></script>
<script>

  // Overview stats
  function renderOverview() {
    const bar = document.getElementById('overview-bar');
    if (!bar) return;
    const total = STOCKS.reduce((s, x) => s + x.marketCap, 0);
    const gainers = STOCKS.filter(s => s.change > 0).length;
    const losers  = STOCKS.filter(s => s.change < 0).length;
    const avgChange = (STOCKS.reduce((s,x)=>s+x.change,0)/STOCKS.length).toFixed(2);
    const sign = avgChange >= 0 ? '+' : '';

    bar.innerHTML = `
      <div class="overview-card">
        <div class="overview-label">Total Market Cap</div>
        <div class="overview-val">${formatMarketCap(total)}</div>
        <div class="overview-sub" style="color:var(--text2)">EU Markets</div>
      </div>
      <div class="overview-card">
        <div class="overview-label">Stocks Covered</div>
        <div class="overview-val">${STOCKS.length}</div>
        <div class="overview-sub" style="color:var(--text2)">${[...new Set(STOCKS.map(s=>s.country))].length} Countries</div>
      </div>
      <div class="overview-card">
        <div class="overview-label">Avg. Change</div>
        <div class="overview-val ${avgChange >= 0 ? 'pos' : 'neg'}">${sign}${avgChange}%</div>
        <div class="overview-sub" style="color:var(--text2)">Today</div>
      </div>
      <div class="overview-card">
        <div class="overview-label">Gainers / Losers</div>
        <div class="overview-val"><span class="pos">${gainers}</span> / <span class="neg">${losers}</span></div>
        <div class="overview-sub" style="color:var(--text2)">Out of ${STOCKS.length}</div>
      </div>
      <div class="overview-card">
        <div class="overview-label">Largest Cap</div>
        <div class="overview-val" style="font-size:13px;">${STOCKS.sort((a,b)=>b.marketCap-a.marketCap)[0].ticker}</div>
        <div class="overview-sub" style="color:var(--text2)">${formatMarketCap(STOCKS[0].marketCap)}</div>
      </div>
    `;
  }
  renderOverview();

  function toggleColumns() {
    // placeholder for column chooser
  }
</script>
<script src="js/analytics.js" defer></script>
</body>
</html>
